<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>CallMee</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-0: #0a0a0a;
      --bg-1: #121212;
      --bg-2: #1e1e1e;
      --surface: rgba(30, 30, 30, 0.7);
      --stroke: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --muted: #a0a0a0;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --font: "Inter", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font);
      background: var(--bg-0);
      overflow: hidden;
    }

    #roomView {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 40%),
                  radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.1), transparent 40%);
    }

    .join-card {
      width: min(440px, 90%);
      padding: 40px;
      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .join-card h1 { margin: 0; font-size: 2rem; font-weight: 800; }
    .join-card p { margin: 0; color: var(--muted); }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,0.2);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    #callView {
      display: none;
      height: 100vh;
      width: 100vw;
      flex-direction: row;
      background: var(--bg-1);
    }

    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 16px;
      gap: 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .room-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--warning);
    }

    #video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      align-content: center;
      justify-content: center;
      overflow: hidden;
      padding-bottom: 80px; /* Space for controls */
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 200px;
      max-height: calc(100vh - 200px);
      background: var(--bg-0);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--stroke);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .video-wrapper.active-speaker {
      border: 2px solid var(--success);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
    }

    .floating-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      padding: 12px 24px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      backdrop-filter: blur(16px);
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .control-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .control-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
    .control-btn.active { background: var(--text); color: var(--bg-0); }
    .control-btn.danger { background: var(--danger); }
    .control-btn.danger:hover { background: #dc2626; }
    .control-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .sidebar {
      width: 360px;
      background: var(--bg-2);
      border-left: 1px solid var(--stroke);
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
    }
    .sidebar.collapsed { width: 0; border: none; }
    .sidebar.collapsed * { display: none; }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--stroke);
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .participant-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-md);
      border: 1px solid transparent;
    }
    .participant-meta { display: flex; flex-direction: column; }
    .participant-name { font-weight: 600; font-size: 0.95rem; }
    .participant-status { font-size: 0.8rem; color: var(--muted); }
    .mic-icon { color: var(--muted); font-size: 0.9rem; }
    .mic-icon.muted { color: var(--danger); }
    
    #chatBox {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 10px;
    }
    .chat-msg {
      background: rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      max-width: 90%;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .chat-msg.self {
      align-self: flex-end;
      background: var(--accent);
    }
    .chat-empty { text-align: center; color: var(--muted); font-size: 0.9rem; margin: auto; }
    
    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 16px;
      background: var(--bg-1);
      border-top: 1px solid var(--stroke);
    }
    
    .btn-icon {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      border-radius: var(--radius-sm);
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .btn-icon:disabled { opacity: 0.5; }

    #toastContainer {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      display: grid;
      gap: 10px;
      width: min(360px, calc(100vw - 40px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      background: var(--bg-2);
      border: 1px solid var(--stroke);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: popIn 0.2s ease;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warning, .toast.info { border-left: 4px solid var(--accent); }
    
    @keyframes popIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .video-mute-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 6px;
      border-radius: 50%;
      z-index: 20;
    }
    
    .video-nametag {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 10;
      pointer-events: none;
    }
    
    .typing-indicator {
      font-size: 0.85rem;
      color: var(--accent);
      font-style: italic;
      margin-top: -4px;
      margin-bottom: 8px;
      display: none;
    }
    
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    .hidden { display: none !important; }

    /* Progress bar styles */
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: var(--accent);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="roomView">
      <div class="join-card">
        <h1>CallMee</h1>
        <p>Professional low-latency video meetings.</p>
        
        <div class="input-group">
          <input type="text" id="usernameInput" placeholder="Display Name" maxlength="32" />
          <input type="text" id="roomInput" placeholder="Room ID" maxlength="64" />
          <input type="password" id="passwordInput" placeholder="Room Password (optional)" maxlength="128" />
          <label class="sr-only" for="deviceSelect">Microphone device</label>
          <select id="deviceSelect"><option value="">Detecting hardware...</option></select>
          <button id="joinBtn" class="btn-primary">Join Room</button>
        </div>
      </div>
    </section>

    <section id="callView">
      <div class="main-stage">
        <div class="header-bar">
          <div class="room-info">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Awaiting handshake...</span>
            <span id="roomChipValue" style="color:var(--muted); margin-left: 10px; font-weight:600;"></span>
            <span id="peerCount" style="color:var(--muted); margin-left: 10px;">Peers: 0</span>
          </div>
          <div style="display:flex; gap:10px;">
            <button id="copyLinkBtn" class="btn-primary" style="padding: 8px 16px; font-size: 0.9rem;"><i class="fa-solid fa-link"></i> Invite</button>
          </div>
        </div>

        <div id="video-grid"></div>

        <div class="floating-controls">
          <button id="muteBtn" class="control-btn" title="Toggle Microphone" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
          <button id="videoBtn" class="control-btn" title="Toggle Camera" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg></button>
          <button id="screenShareBtn" class="control-btn" title="Share Screen" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg></button>
          <button id="recordBtn" class="control-btn" title="Record Audio" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg></button>
          <button id="retryMicBtn" class="control-btn" title="Refresh Audio Device"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>
          <button id="toggleSidebarBtn" class="control-btn" title="Toggle Sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
          <button id="hangupBtn" class="control-btn danger" title="Leave Call"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></button>
        </div>
      </div>
      
      <aside class="sidebar" id="sidePanel">
        <div class="sidebar-tabs">
          <button class="tab-btn active" id="tabChat">Chat</button>
          <button class="tab-btn" id="tabParticipants">Participants</button>
        </div>
        
        <div class="sidebar-content" id="chatPanel">
          <div id="chatBox">
            <div class="chat-empty">Send a message to the room.</div>
          </div>
          <div class="typing-indicator" id="typingIndicator">Someone is typing...</div>
          <div class="chat-input-row">
            <input type="file" id="fileInput" class="sr-only" />
            <button id="attachFileBtn" class="btn-icon" title="Send File"><i class="fa-solid fa-paperclip"></i></button>
            <input type="text" id="chatInput" placeholder="Message..." disabled maxlength="4000" style="flex:1" />
            <button id="sendBtn" class="btn-icon" disabled><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
        
        <div class="sidebar-content hidden" id="participantsPanel">
          
          <div class="sidebar-section" style="padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 16px;">
            <label style="font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; display: block;">Select Microphone</label>
            <select id="midCallDeviceSelect" class="form-input" style="width: 100%; padding: 8px; font-size: 0.9rem; margin-bottom: 12px;">
              <option value="">Default Microphone</option>
            </select>
            
            <label style="font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; display: block;">Select Camera</label>
            <select id="midCallCameraSelect" class="form-input" style="width: 100%; padding: 8px; font-size: 0.9rem;">
              <option value="">Default Camera</option>
            </select>
          </div>

          <div id="participantList">
             <div class="chat-empty">No participants yet.</div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <div id="toastContainer"></div>
  <span id="micWarningBadge" class="hidden"></span>
  <span id="socketState" class="hidden"></span>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/config.js"></script>
  <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="app.js"></script>
</body>
</html>
